<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashone - Elite Digital</title>
<script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
<script src="https://unpkg.com/gsap@3/dist/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/@studio-freight/lenis"></script>
<style>
:root {
  --bg: #ffffff;
  --text: #0a0a0a;
  --accent: #ff4d00; /* Lando-inspired Orange */
  --subtle: #f4f4f4;
}

body {
  margin: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  cursor: none; 
}

/* FILM NOISE OVERLAY (Subtle for light mode) */
.noise {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  pointer-events: none;
  z-index: 9998;
  opacity: 0.02;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
}

/* LOADER - High Impact Black to White transition */
.loader {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: var(--text);
  z-index: 10000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}
.counter-wrap {
  font-size: 8vw;
  font-weight: 900;
  letter-spacing: -4px;
}

/* CUSTOM CURSOR */
.cursor {
  position: fixed;
  top: 0; left: 0;
  width: 10px; height: 10px;
  background: var(--accent);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
}
.cursor-follower {
  position: fixed;
  top: 0; left: 0;
  width: 40px; height: 40px;
  border: 1px solid var(--text);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9998;
  transition: transform 0.1s ease-out;
}

/* TYPOGRAPHY */
h1, h2, h3 { font-weight: 800; letter-spacing: -0.05em; margin: 0; text-transform: uppercase; }
.char { display: inline-block; will-change: transform; }

/* MAIN WRAPPER */
main {
  background: var(--bg);
  position: relative;
  z-index: 2;
  margin-bottom: 100vh;
}

/* HERO */
.hero {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 8%;
}
.hero h1 { font-size: 14vw; line-height: 0.8; margin-bottom: 20px; }
.hero h3 { font-size: 1.5vw; font-weight: 500; text-transform: none; color: var(--accent); }
.logo { width: 100px; position: absolute; top: 40px; left: 8%; filter: invert(0); }

/* SECTIONS */
.section { padding: 12vw 8%; }
.section h2 { font-size: 6vw; line-height: 0.9; margin-bottom: 30px; }
.section p { font-size: 1.4vw; opacity: 0.6; margin-bottom: 60px; font-weight: 400; max-width: 600px; }

/* IMAGE GRID PARALLAX */
.grid { display: flex; gap: 4vw; align-items: flex-start; }
.col { flex: 1; display: flex; flex-direction: column; gap: 4vw; }

.img-wrap {
  overflow: hidden;
  border-radius: 4px;
  position: relative;
  background: var(--subtle);
}
.img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scale(1.2);
  transition: transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}
.img-wrap:hover img { transform: scale(1.05); }

/* SCROLLER - Light Mode */
.scroller {
  overflow: hidden;
  padding: 60px 0;
  background: var(--subtle);
}
.scroller__inner {
  display: flex;
  gap: 5vw;
  width: max-content;
}
.scroller img { width: 100px; filter: grayscale(100%); opacity: 0.4; transition: 0.5s; }
.scroller img:hover { filter: grayscale(0%); opacity: 1; transform: scale(1.2) rotate(5deg); }

/* MAGNETIC CTA - Elite Style */
.cta-wrap { display: flex; justify-content: center; margin-top: 100px; }
.cta {
  width: 250px; height: 250px;
  background: var(--text);
  color: white;
  border-radius: 50%;
  font-size: 1.2vw;
  font-weight: 700;
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
  text-transform: uppercase;
  transition: background 0.3s;
}
.cta:hover { background: var(--accent); }

/* FULL REVEAL FOOTER */
.footer {
  position: fixed;
  bottom: 0; left: 0;
  width: 100%;
  height: 100vh;
  z-index: 1;
  background: var(--accent);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: white;
}
.footer h2 { font-size: 12vw; margin: 0; }
</style>
</head>
<body>

<div class="noise"></div>
<div class="cursor"></div>
<div class="cursor-follower"></div>

<div class="loader">
  <div class="counter-wrap"><span class="counter">0</span></div>
</div>

<main>
  <section class="section hero">
    <img src="assets/img/web_hero_logo.svg" class="logo">
    <h3 class="fade-up">Digital Production Studio</h3>
    <h1 class="split-text">HASHONE</h1>
    <h1 class="split-text" style="color:var(--accent); margin-top: -2vw;">STUDIO</h1>
  </section>

  <section class="section" style="padding-top: 0;">
    <div class="img-wrap reveal-img" style="height: 80vh;">
      <img src="assets/img/custom-animation/web_poster_1.png">
    </div>
  </section>

  <section class="section">
    <h2 class="split-text">Selected<br>Works</h2>
    <p class="fade-up">We push the boundaries of digital interaction to create products that people actually love using.</p>
    
    <div class="grid">
      <div class="col" style="margin-top: 10vw;">
        <div class="img-wrap reveal-img"><img src="assets/img/products/app_image_caro.png"></div>
        <div class="img-wrap reveal-img"><img src="assets/img/products/app_image_vintify.png"></div>
      </div>
      <div class="col">
        <div class="img-wrap reveal-img"><img src="assets/img/products/app_image_panocut.png"></div>
        <div class="img-wrap reveal-img"><img src="assets/img/products/app_image_dun.png"></div>
      </div>
    </div>
  </section>

  <div class="scroller marquee-1">
    <div class="scroller__inner">
        <img src="assets/img/app_icons/1.png"><img src="assets/img/app_icons/2.png">
        <img src="assets/img/app_icons/3.png"><img src="assets/img/app_icons/4.png">
        <img src="assets/img/app_icons/5.png"><img src="assets/img/app_icons/6.png">
        <img src="assets/img/app_icons/7.png"><img src="assets/img/app_icons/8.png">
    </div>
  </div>

  <section class="section">
    <div class="cta-wrap magnetic-wrap">
      <a href="#" class="cta magnetic-btn">
        <span>Work With Us</span>
      </a>
    </div>
  </section>
</main>

<footer class="footer">
  <h2>HASHONE</h2>
  <p style="font-weight: 600; letter-spacing: 2px;">© 2026 • ESTABLISHED IN INDIA</p>
</footer>

<script>
// --- 1. SMOOTH SCROLL (Lenis) ---
const lenis = new Lenis({ duration: 1.2, easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)) });
function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
requestAnimationFrame(raf);

gsap.registerPlugin(ScrollTrigger);

// --- 2. TEXT SPLITTING ---
document.querySelectorAll('.split-text').forEach(el => {
  const text = el.innerText;
  el.innerHTML = text.split('').map(char => `<span class="char">${char === ' ' ? '&nbsp;' : char}</span>`).join('');
});

// --- 3. CURSOR PHYSICS ---
const cursor = document.querySelector('.cursor');
const follower = document.querySelector('.cursor-follower');
window.addEventListener('mousemove', e => {
    gsap.to(cursor, { x: e.clientX, y: e.clientY, duration: 0 });
    gsap.to(follower, { x: e.clientX - 15, y: e.clientY - 15, duration: 0.3 });
});

// --- 4. PRELOADER & REVEAL ---
let tlLoader = gsap.timeline();
tlLoader.to(".counter", {
  innerText: 100, duration: 1.5, snap: { innerText: 1 },
  onUpdate: function() { document.querySelector(".counter").innerText = Math.ceil(this.targets()[0].innerText); }
})
.to(".loader", { yPercent: -100, duration: 1.2, ease: "expo.inOut" })
.from(".hero .char", { y: 200, rotation: 10, stagger: 0.02, duration: 1.5, ease: "expo.out" }, "-=0.5")
.from(".hero h3", { opacity: 0, y: 20, duration: 1 }, "-=1");

// --- 5. SCROLL ANIMATIONS ---
// Heavy Image Reveal
gsap.utils.toArray(".reveal-img").forEach(wrap => {
  gsap.fromTo(wrap, 
    { clipPath: "inset(100% 0% 0% 0%)" }, 
    { clipPath: "inset(0% 0% 0% 0%)", duration: 1.5, ease: "power4.inOut", scrollTrigger: { trigger: wrap, start: "top 80%" } }
  );
  gsap.to(wrap.querySelector("img"), {
    yPercent: -20, ease: "none",
    scrollTrigger: { trigger: wrap, scrub: true }
  });
});

// Parallax Columns
gsap.to(".grid .col:first-child", { y: -100, scrollTrigger: { trigger: ".grid", scrub: true } });

// Marquee Physics
function initMarquee() {
    const inner = document.querySelector(".scroller__inner");
    inner.appendChild(inner.cloneNode(true));
    gsap.to(inner, { xPercent: -50, duration: 20, ease: "none", repeat: -1 });
}
initMarquee();

// --- 6. MAGNETIC INTERACTION ---
const magWrap = document.querySelector('.magnetic-wrap');
const magBtn = document.querySelector('.magnetic-btn');

magWrap.addEventListener('mousemove', (e) => {
  const rect = magWrap.getBoundingClientRect();
  const x = e.clientX - rect.left - rect.width / 2;
  const y = e.clientY - rect.top - rect.height / 2;
  gsap.to(magBtn, { x: x * 0.8, y: y * 0.8, duration: 0.6, ease: "power2.out" });
  gsap.to(magBtn.querySelector('span'), { x: x * 0.4, y: y * 0.4, duration: 0.6 });
});

magWrap.addEventListener('mouseleave', () => {
  gsap.to([magBtn, magBtn.querySelector('span')], { x: 0, y: 0, duration: 1, ease: "elastic.out(1, 0.3)" });
});
</script>
</body>
</html>
